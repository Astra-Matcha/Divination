<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>룬스톤 형태 쇼케이스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121318;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .stone-base {
            background: radial-gradient(circle at 35% 35%, #525a66, #282b33 60%, #121418);
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.8),
                inset 8px 8px 12px rgba(255, 255, 255, 0.15);
        }

        .shape-polygon {
            clip-path: polygon(30% 0%, 75% 5%, 95% 35%, 85% 85%, 55% 98%, 15% 90%, 2% 50%, 10% 20%);
        }

        .shape-pebble {
            border-radius: 40% 60% 50% 50% / 60% 40% 60% 40%;
        }

        .shape-gem {
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
        }

        .rune-icon {
            stroke: #ffd700;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0 0 6px #ffaa00);
        }
    </style>
</head>
<body class="min-h-screen text-slate-200 flex flex-col justify-between items-center p-6">

    <header class="text-center my-8">
        <h1 class="text-2xl md:text-3xl font-bold text-amber-300 tracking-wider">고대 룬스톤 형태 스타일</h1>
        <p class="text-sm text-slate-400 mt-2">복잡한 애니메이션을 제외하고 돌의 구조와 문양 형태만 강조한 프리뷰입니다.</p>
    </header>

    <main class="w-full max-w-5xl flex-1 flex flex-wrap items-center justify-center gap-10 md:gap-16 my-auto py-8">
        
        <!-- Item 1: Polygon Stone -->
        <div class="flex flex-col items-center gap-4">
            <div class="stone-base shape-polygon w-44 h-56 flex items-center justify-center relative">
                <svg class="rune-icon w-20 h-20" viewBox="0 0 100 100">
                    <path d="M50,15 L50,85 M50,30 L75,15 M50,45 L25,60" />
                </svg>
            </div>
            <div class="text-center">
                <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-amber-300 border border-slate-700">1. 각진 다각형 석판</span>
                <p class="text-xs text-slate-500 mt-1">polygon() 속성 활용</p>
            </div>
        </div>

        <!-- Item 2: Pebble Stone -->
        <div class="flex flex-col items-center gap-4">
            <div class="stone-base shape-pebble w-44 h-56 flex items-center justify-center relative">
                <svg class="rune-icon w-20 h-20" viewBox="0 0 100 100">
                    <path d="M35,15 L35,85 M35,15 L70,35 L35,55 M35,35 L70,55 L35,75" />
                </svg>
            </div>
            <div class="text-center">
                <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-amber-300 border border-slate-700">2. 자연스러운 조약돌</span>
                <p class="text-xs text-slate-500 mt-1">border-radius 비대칭 활용</p>
            </div>
        </div>

        <!-- Item 3: Cut Gem Stone -->
        <div class="flex flex-col items-center gap-4">
            <div class="stone-base shape-gem w-44 h-56 flex items-center justify-center relative">
                <svg class="rune-icon w-20 h-20" viewBox="0 0 100 100">
                    <path d="M25,25 L75,75 M75,25 L25,75 M50,10 L50,90" />
                </svg>
            </div>
            <div class="text-center">
                <span class="text-xs font-semibold px-2.5 py-1 rounded bg-slate-800 text-amber-300 border border-slate-700">3. 원석 절단형</span>
                <p class="text-xs text-slate-500 mt-1">정교한 다각 각도 절단</p>
            </div>
        </div>

    </main>

    <footer class="text-xs text-slate-600 my-4">
        Pure HTML & CSS Runestone Shape Showcase
    </footer>

</body>
</html>
